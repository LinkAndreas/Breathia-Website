# Breathia website: a single Caddy container serving the static site on port 32772.
# The port is bound to localhost only: the domain and HTTPS come from the Cloudflare Tunnel (or
# another reverse proxy) on the VPS, see README › Deploying.
#
#   docker compose up -d --build     # → http://localhost:32772

services:
  breathia-website:
    build:
      context: .
      args:
        SITE_URL: ${SITE_URL:-https://www.linkandreas.de/breathia/}
    image: breathia-website:latest
    container_name: breathia-website
    ports:
      - "127.0.0.1:32772:8080"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /config
      - /data
    security_opt:
      - no-new-privileges:true
