# Breathia website: a single Caddy container serving the static site on port 32772.
# HTTPS and the domain come from the reverse proxy on the VPS (see README › Deploying).
#
#   docker compose up -d --build     # → http://localhost:32772

services:
  breathia-website:
    build:
      context: .
      args:
        SITE_URL: ${SITE_URL:-https://www.linkandreas.de/breathia/}
    image: breathia-website:latest
    container_name: breathia-website
    ports:
      - "32772:8080"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /config
      - /data
    security_opt:
      - no-new-privileges:true
