name: breathia-website

services:
  breathia-website:
    # Built by GitHub Actions (.github/workflows/deploy.yml); TAG is the commit SHA of the deploy.
    image: ghcr.io/linkandreas/breathia-website:${TAG:-latest}
    container_name: breathia-website
    # No published ports: the cloudflared container on the `web` network reaches it at
    # http://breathia-website:32772 and serves it (with HTTPS) at the domain.
    networks:
      - web
    restart: unless-stopped

networks:
  web:
    external: true
